<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SmartBill — Receipt & Expense Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#080611;--bg2:#120a24;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);
    --brd:rgba(255,255,255,.12);--fg:#f3eeff;--mut:#a99ec7;--acc:#a855f7;
    --grad:linear-gradient(120deg,#8b5cf6,#ec4899 55%,#22d3ee);
    --grad-btn:linear-gradient(120deg,#8b5cf6,#ec4899);
    --good:#34d399;--warn:#fbbf24;--bad:#fb7185;--r:20px;
    --b1:#7c3aed;--b2:#ec4899;--b3:#06b6d4;
  }
  @media(prefers-color-scheme:light){
    :root{--bg:#f4f1fb;--bg2:#efe7ff;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);
      --brd:rgba(20,10,40,.1);--fg:#1c1330;--mut:#6b6088;--acc:#7c3aed;
      --b1:#c4b5fd;--b2:#fbcfe8;--b3:#a5f3fc;}
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;font:16px/1.55 'Outfit',system-ui,Segoe UI,Roboto,sans-serif;
    color:var(--fg);background:var(--bg);overflow-x:hidden;position:relative}
  /* animated gradient blobs */
  body::before,body::after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(80px);opacity:.55;pointer-events:none}
  body::before{width:52vw;height:52vw;left:-12vw;top:-14vw;background:radial-gradient(circle,var(--b1),transparent 70%);animation:drift1 18s ease-in-out infinite}
  body::after{width:46vw;height:46vw;right:-12vw;bottom:-16vw;background:radial-gradient(circle,var(--b2),transparent 70%);animation:drift2 22s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(6vw,8vh) scale(1.15)}}
  @keyframes drift2{50%{transform:translate(-7vw,-6vh) scale(1.1)}}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    background:linear-gradient(var(--glass),var(--glass));border-bottom:1px solid var(--brd)}
  .brand{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand .logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:17px;box-shadow:0 4px 16px rgba(168,85,247,.5)}
  .brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{max-width:940px;margin:0 auto;padding:26px 20px 60px}
  #bg3d{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;display:block}
  .wrap{transform-style:preserve-3d}
  .card{background:var(--glass);border:1px solid var(--brd);border-radius:var(--r);padding:22px;margin-bottom:18px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,.28);
    transition:transform .2s ease,box-shadow .2s ease;will-change:transform;transform-style:preserve-3d}
  @media(prefers-color-scheme:light){.card{box-shadow:0 10px 40px rgba(90,50,160,.12)}}
  h2,h3{font-family:'Space Grotesk';letter-spacing:-.02em}
  button{cursor:pointer;border:none;background:var(--grad-btn);color:#fff;padding:11px 18px;border-radius:14px;
    font:inherit;font-weight:600;transition:transform .15s,box-shadow .15s,filter .15s;box-shadow:0 6px 20px rgba(236,72,153,.35)}
  button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(236,72,153,.5);filter:saturate(1.15)}
  button:active{transform:translateY(0)}
  button.ghost{background:var(--glass2);color:var(--fg);border:1px solid var(--brd);box-shadow:none}
  button.ghost:hover{box-shadow:0 6px 18px rgba(0,0,0,.2);filter:none}
  input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--brd);border-radius:14px;
    background:var(--glass2);color:var(--fg);font:inherit;margin:5px 0;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(168,85,247,.22)}
  select option{color:#111}
  label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
  .tabs{display:inline-flex;gap:4px;margin-bottom:18px;padding:5px;background:var(--glass);border:1px solid var(--brd);border-radius:16px}
  .tabs button{background:transparent;color:var(--mut);box-shadow:none;padding:9px 18px;border-radius:12px;font-weight:600}
  .tabs button:hover{transform:none;color:var(--fg)}
  .tabs button.on{background:var(--grad-btn);color:#fff;box-shadow:0 6px 18px rgba(236,72,153,.4)}
  .muted{color:var(--mut);font-size:14px}.hide{display:none}
  .bar{height:12px;border-radius:8px;background:var(--grad);box-shadow:0 0 14px rgba(168,85,247,.4)}
  .catrow{display:flex;align-items:center;gap:12px;margin:11px 0}
  .catrow .t{width:120px;font-weight:600}.catrow .v{width:96px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .catrow .track{flex:1;height:12px;background:var(--glass2);border-radius:8px;overflow:hidden}
  .alert{border:1px solid rgba(251,191,36,.4);
    background:linear-gradient(120deg,rgba(251,191,36,.14),rgba(236,72,153,.1));
    padding:13px 15px;border-radius:14px;margin:10px 0;font-size:14.5px;line-height:1.5}
  .alert::before{content:"🔥 ";font-size:17px}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  td,th{padding:11px 8px;border-bottom:1px solid var(--brd);text-align:left}
  th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  tbody tr{transition:background .15s}tbody tr:hover{background:var(--glass)}
  .pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--grad-btn);color:#fff}
  a{color:var(--acc);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
  .err{color:var(--bad);font-size:14px;font-weight:500}
  .drop{border:2px dashed var(--brd);border-radius:16px;padding:34px 20px;text-align:center;color:var(--mut);
    background:var(--glass);transition:border-color .2s,background .2s}
  .drop.hot,.drop:hover{border-color:var(--acc);background:var(--glass2)}
  .drop .emoji{font-size:40px;display:block;margin-bottom:6px;filter:drop-shadow(0 4px 12px rgba(168,85,247,.5))}
  .hero{text-align:center;margin-bottom:6px}
  .hero .big{font-family:'Space Grotesk';font-size:30px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px}
  .hero .big b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .glow-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;padding:13px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🧾</span><span>Smart<b>Bill</b></span></div>
  <div id="who"></div>
</header>

<!-- LOGIN -->
<div class="wrap" id="auth">
  <div class="card" style="max-width:430px;margin:44px auto">
    <div class="hero">
      <p class="big">snap it. <b>track it.</b></p>
      <p class="muted" style="margin:0 0 18px">Turn any receipt into insights in seconds ✨</p>
    </div>
    <button class="glow-btn" onclick="google()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.3 13.5 17.6 9.5 24 9.5z"/><path fill="#fff" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.9z" opacity=".9"/><path fill="#fff" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z" opacity=".7"/><path fill="#fff" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.1-5.5c-2 1.3-4.6 2.1-8.2 2.1-6.4 0-11.7-4-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z" opacity=".85"/></svg> Continue with Google</button>
    <div class="tabs" style="margin-top:16px">
      <button class="on" onclick="authTab('email',event)">Email</button>
      <button onclick="authTab('phone',event)">Phone</button>
    </div>
    <div id="tab-email">
      <label>Email</label><input id="em" type="email" placeholder="you@example.com"/>
      <label>Password</label><input id="pw" type="password" placeholder="••••••••"/>
      <div class="row" style="margin-top:8px">
        <button onclick="emailAuth('in')">Log in</button>
        <button class="ghost" onclick="emailAuth('up')">Sign up</button>
      </div>
    </div>
    <div id="tab-phone" class="hide">
      <label>Phone (with country code)</label><input id="ph" placeholder="+9198…"/>
      <button style="width:100%;margin-top:6px" onclick="sendOtp()">Send code</button>
      <div id="otpbox" class="hide">
        <label>6-digit code</label><input id="otp" inputmode="numeric"/>
        <button style="width:100%" onclick="verifyOtp()">Verify</button>
      </div>
    </div>
    <p class="err" id="authErr"></p>
    <p class="muted" id="cfgWarn"></p>
  </div>
</div>

<!-- APP -->
<div class="wrap hide" id="app">
  <div class="tabs">
    <button class="on" onclick="view('add',event)">Add receipt</button>
    <button onclick="view('dash',event)">Insights</button>
  </div>

  <div id="v-add">
    <div class="card">
      <div class="drop" id="drop">
        <input id="file" type="file" accept="image/*" class="hide"/>
        <span class="emoji">🧾</span>
        <p style="font-weight:600;font-size:17px;margin:0 0 4px">Drop your receipt here</p>
        <p class="muted" style="margin:0">or <a href="#" onclick="file.click();return false">browse files</a> — we'll read it for you 👀</p>
        <p class="muted" id="ocrStat"></p>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div><label>Store</label><input id="f_store"/></div>
        <div><label>Date</label><input id="f_date" type="date"/></div>
      </div>
      <div class="row">
        <div><label>Amount (₹)</label><input id="f_amount" type="number" step="0.01"/></div>
        <div><label>Tax (₹)</label><input id="f_tax" type="number" step="0.01"/></div>
        <div><label>Category</label>
          <select id="f_cat"></select>
        </div>
      </div>
      <label>Items (one per line)</label>
      <textarea id="f_items" rows="3"></textarea>
      <button style="margin-top:10px" onclick="saveExpense()">Save expense</button>
      <span class="err" id="saveErr"></span>
    </div>
  </div>

  <div id="v-dash" class="hide">
    <div class="card">
      <div class="row" style="align-items:center;margin-bottom:6px">
        <h3 style="margin:0;flex:1">Insights</h3>
        <input id="monPick" type="month" style="flex:0 0 auto;width:auto;margin:0"/>
        <button class="ghost" style="flex:0 0 auto" onclick="exportCsv()">Export CSV</button>
      </div>
      <div id="alerts"></div>
      <div id="cats"></div>
      <p class="muted" id="dashEmpty"></p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Recent</h3>
      <table><thead><tr><th>Date</th><th>Store</th><th>Cat</th><th style="text-align:right">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const localDate=len=>{const d=new Date();return(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')).slice(0,len);};
const CATS=["Food","Transport","Shopping","Groceries","Bills","Health","Entertainment","Other"];
const KW={Food:["restaurant","cafe","pizza","burger","zomato","swiggy","dine","food","bakery"],
  Transport:["uber","ola","fuel","petrol","diesel","metro","taxi","cab","travel"],
  Groceries:["mart","supermarket","grocery","dmart","bigbasket","kirana"],
  Shopping:["mall","fashion","apparel","store","myntra","amazon","flipkart"],
  Bills:["electric","recharge","broadband","bill","utility","gas"],
  Health:["pharmacy","medical","hospital","clinic","apollo","chemist"],
  Entertainment:["cinema","movie","pvr","netflix","game"]};
CATS.forEach(c=>f_cat.add(new Option(c,c)));

let sb=null;
if(window.SB_URL&&!SB_URL.includes("YOUR")){sb=supabase.createClient(SB_URL,SB_ANON);}
else{cfgWarn.textContent="⚠ Add your keys in config.js to enable login & saving.";}

function authTab(t,e){tab_email.classList.toggle('hide',t!='email');tab_phone.classList.toggle('hide',t!='phone');
  document.querySelectorAll('#auth .tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');}
function view(v,e){['add','dash'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hide',x!=v));
  document.querySelectorAll('#app .tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');
  if(v=='dash')loadDash();}

async function google(){if(!sb)return;await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});}
async function emailAuth(m){if(!sb)return;authErr.textContent="";
  const email=em.value.trim(),password=pw.value;
  const fn=m=='up'?sb.auth.signUp:sb.auth.signInWithPassword;
  const{error}=await fn.call(sb.auth,{email,password});
  if(error)authErr.textContent=error.message;else if(m=='up')authErr.textContent="Check your email to confirm, then log in.";}
async function sendOtp(){if(!sb)return;authErr.textContent="";
  const{error}=await sb.auth.signInWithOtp({phone:ph.value.trim()});
  if(error)authErr.textContent=error.message;else otpbox.classList.remove('hide');}
async function verifyOtp(){if(!sb)return;
  const{error}=await sb.auth.verifyOtp({phone:ph.value.trim(),token:otp.value.trim(),type:'sms'});
  if(error)authErr.textContent=error.message;}

async function refreshUser(){if(!sb)return;const{data}=await sb.auth.getUser();gate(data.user);}
function gate(user){
  document.getElementById('auth').classList.toggle('hide',!!user);
  document.getElementById('app').classList.toggle('hide',!user);
  who.innerHTML = user? `<span class="muted">${user.email||user.phone}</span> <button class="ghost" onclick="signOut()">Sign out</button>`:'';
  if(!f_date.value)f_date.value=localDate(10);
}
async function signOut(){await sb.auth.signOut();location.reload();}
if(sb){sb.auth.onAuthStateChange((_,s)=>gate(s&&s.user));refreshUser();}

// ---- OCR ----
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot');});
drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');if(e.dataTransfer.files[0])ocr(e.dataTransfer.files[0]);});
file.addEventListener('change',e=>{if(e.target.files[0])ocr(e.target.files[0]);});
async function ocr(f){
  ocrStat.textContent="Reading… 0%";
  try{
    const{data}=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.status=='recognizing text')ocrStat.textContent="Reading… "+Math.round(m.progress*100)+"%";}});
    ocrStat.textContent="Extracted. Review below ✎";
    parse(data.text);
  }catch(err){ocrStat.textContent="OCR failed: "+err.message;}
}
function parse(text){
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  f_items.value=lines.slice(0,12).join('\n');
  // store = first meaningful line
  f_store.value=(lines.find(l=>/[a-z]/i.test(l))||'').slice(0,60);
  // amount = biggest number near "total", else biggest number
  const nums=[...text.matchAll(/(\d[\d,]*\.\d{2})/g)].map(m=>+m[1].replace(/,/g,''));
  let total=0;
  const tl=lines.find(l=>/total/i.test(l)&&/\d/.test(l));
  if(tl){const m=tl.match(/(\d[\d,]*\.?\d*)/g);if(m)total=+m[m.length-1].replace(/,/g,'');}
  if(!total&&nums.length)total=Math.max(...nums);
  f_amount.value=total||'';
  // tax
  const xl=lines.find(l=>/(tax|gst|vat)/i.test(l)&&/\d/.test(l));
  if(xl){const m=xl.match(/(\d[\d,]*\.?\d*)/g);if(m)f_tax.value=+m[m.length-1].replace(/,/g,'');}
  // date
  const dm=text.match(/(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/);
  if(dm){const p=dm[1].split(/[\/\-.]/);let[a,b,c]=p;if(c.length==2)c='20'+c;
    if(+a>31){f_date.value=`${a}-${b.padStart(2,'0')}-${c.padStart(2,'0')}`;}
    else{f_date.value=`${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;}}
  // category guess
  const low=text.toLowerCase();let cat="Other";
  for(const c in KW){if(KW[c].some(k=>low.includes(k))){cat=c;break;}}
  f_cat.value=cat;
}

// ---- SAVE ----
async function saveExpense(){
  saveErr.textContent="";if(!sb){saveErr.textContent="Configure Supabase first.";return;}
  const{data:{user}}=await sb.auth.getUser();
  const rec={user_id:user.id,store:f_store.value||'Unknown',purchased_on:f_date.value,
    amount:+f_amount.value||0,tax:+f_tax.value||0,category:f_cat.value,
    items:f_items.value.split('\n').filter(Boolean)};
  const{error}=await sb.from('expenses').insert(rec);
  if(error){saveErr.textContent=error.message;return;}
  ['f_store','f_amount','f_tax','f_items'].forEach(id=>document.getElementById(id).value='');
  ocrStat.textContent="Saved ✓ Add another or view Insights.";
}

// ---- DASHBOARD ----
let _exp=[];
async function loadDash(){
  const{data,error}=await sb.from('expenses').select('*').order('purchased_on',{ascending:false});
  if(error){dashEmpty.textContent=error.message;return;}
  _exp=data;
  if(!monPick.value)monPick.value=localDate(7);
  renderRecent(data);renderInsights(data,monPick.value);
}
monPick.addEventListener('change',()=>renderInsights(_exp,monPick.value));
function exportCsv(){
  const head=['date','store','category','amount','tax','items'];
  const esc=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const body=_exp.map(r=>[r.purchased_on,r.store,r.category,r.amount,r.tax,(r.items||[]).join('; ')].map(esc).join(','));
  const csv=[head.join(','),...body].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='smartbill-expenses.csv';a.click();URL.revokeObjectURL(a.href);
}
function ym(d){return d.slice(0,7);}
function renderRecent(data){
  rows.innerHTML=data.slice(0,15).map(r=>`<tr>
    <td>${r.purchased_on}</td><td>${r.store||''}</td><td><span class="pill">${r.category}</span></td>
    <td style="text-align:right">₹${(+r.amount).toLocaleString('en-IN')}</td>
    <td><a href="#" onclick="del('${r.id}');return false" class="err">✕</a></td></tr>`).join('')
    ||'<tr><td colspan=5 class="muted">No expenses yet.</td></tr>';
}
async function del(id){await sb.from('expenses').delete().eq('id',id);loadDash();}
function renderInsights(data,curM){
  const[Y,M]=curM.split('-').map(Number);
  const cur={},hist={}; // category totals: selected month vs prior 3 months
  const prior=new Set();for(let i=1;i<=3;i++){let mm=M-i,yy=Y;while(mm<1){mm+=12;yy--;}prior.add(yy+'-'+String(mm).padStart(2,'0'));}
  data.forEach(r=>{const m=ym(r.purchased_on),a=+r.amount;
    if(m==curM)cur[r.category]=(cur[r.category]||0)+a;
    if(prior.has(m)){hist[r.category]=hist[r.category]||[];hist[r.category].push(a);} });
  const curTotal=Object.values(cur).reduce((a,b)=>a+b,0);
  dashEmpty.textContent=curTotal?'':'No spending recorded this month.';
  const max=Math.max(1,...Object.values(cur));
  cats.innerHTML=Object.entries(cur).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
    <div class="catrow"><div class="t">${c}</div>
      <div class="track"><div class="bar" style="width:${v/max*100}%"></div></div>
      <div class="v">₹${v.toLocaleString('en-IN')}</div></div>`).join('');
  // unusual spending: current month category vs 3-month monthly average
  const al=[];
  for(const c in cur){
    const h=hist[c];if(!h||!h.length)continue;
    const avg=h.reduce((a,b)=>a+b,0)/3; // avg per month over 3 months
    if(avg>0&&cur[c]>avg*1.2){const pct=Math.round((cur[c]/avg-1)*100);
      al.push(`Your <b>${c}</b> spending is <b>${pct}% higher</b> than your 3-month average (₹${Math.round(avg).toLocaleString('en-IN')}).`);}
  }
  alerts.innerHTML=al.map(a=>`<div class="alert">${a}</div>`).join('');
}
</script>

<!-- ===== Immersive 3D environment (Three.js) ===== -->
<script>
(function(){
  if(typeof THREE==='undefined'){console.warn('three.js not loaded');return;}
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  // auto-simplify on phones / touch devices, and honour reduced-motion
  const lite=innerWidth<768||matchMedia('(pointer:coarse)').matches||(navigator.hardwareConcurrency||8)<=4;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const M=reduce?0:1; // global motion multiplier
  const cvs=document.createElement('canvas');cvs.id='bg3d';document.body.prepend(cvs);
  const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:!lite,alpha:true,powerPreference:lite?'low-power':'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,lite?1.5:2)); // crisp on hi-DPI, lighter on mobile
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(dark?0x0a0713:0xece6fb,0.055);
  const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
  cam.position.set(0,0,9);

  scene.add(new THREE.AmbientLight(0x8878b8,dark?0.55:0.9));
  const key=new THREE.DirectionalLight(0xec4899,1.25);key.position.set(6,7,5);scene.add(key);
  const fill=new THREE.PointLight(0x22d3ee,1.6,45);fill.position.set(-7,-3,4);scene.add(fill);
  const rim=new THREE.PointLight(0x8b5cf6,1.6,45);rim.position.set(5,-5,7);scene.add(rim);

  const grp=new THREE.Group();scene.add(grp);
  const coinGeo=new THREE.CylinderGeometry(0.62,0.62,0.13,48);
  const coinMat=new THREE.MeshStandardMaterial({color:0xf6c945,metalness:1,roughness:0.28,emissive:0x3a2900,emissiveIntensity:0.35});
  const cardGeo=new THREE.BoxGeometry(1.15,1.55,0.05);
  const objs=[];
  for(let i=0;i<(lite?8:20);i++){
    const coin=Math.random()<0.5;
    const mat=coin?coinMat:new THREE.MeshStandardMaterial({
      color:coin?0xf6c945:(Math.random()<0.5?0x8b5cf6:0xec4899),
      metalness:coin?1:0.35,roughness:coin?0.28:0.45,transparent:true,opacity:0.92});
    const m=new THREE.Mesh(coin?coinGeo:cardGeo,mat);
    m.position.set((Math.random()-0.5)*17,(Math.random()-0.5)*13,(Math.random()-0.5)*9-2);
    m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    m.userData={sp:0.25+Math.random()*0.6,fl:Math.random()*6.28,amp:0.4+Math.random()*0.7};
    grp.add(m);objs.push(m);
  }
  // particle dust
  const N=lite?120:420,pg=new THREE.BufferGeometry(),pp=new Float32Array(N*3);
  for(let i=0;i<N*3;i++)pp[i]=(Math.random()-0.5)*34;
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xa855f7,size:0.055,transparent:true,opacity:dark?0.6:0.4}));
  scene.add(pts);

  let mx=0,my=0;
  if(!lite)addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-0.5;my=e.clientY/innerHeight-0.5;},{passive:true});
  function size(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
  addEventListener('resize',size);size();

  const clock=new THREE.Clock();let run=true;
  document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run)loop();});
  function loop(){
    if(!run)return;requestAnimationFrame(loop);
    const t=clock.getElapsedTime();
    for(const m of objs){m.rotation.x+=0.003*m.userData.sp*M;m.rotation.y+=0.004*m.userData.sp*M;
      m.position.y+=Math.sin(t*m.userData.sp+m.userData.fl)*0.0022*m.userData.amp*M;}
    grp.rotation.y=t*0.03*M;pts.rotation.y=t*0.02*M;
    cam.position.x+=(mx*2.2-cam.position.x)*0.045;
    cam.position.y+=(-my*1.6-cam.position.y)*0.045;
    cam.lookAt(0,0,0);
    renderer.render(scene,cam);
  }
  loop();

  // glass panels tilt in real 3D toward the cursor (desktop only)
  let raf;
  if(!lite)addEventListener('pointermove',e=>{
    if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
      document.querySelectorAll('.card').forEach(c=>{
        const r=c.getBoundingClientRect();
        if(e.clientX<r.left-60||e.clientX>r.right+60||e.clientY<r.top-60||e.clientY>r.bottom+60){c.style.transform='';return;}
        const px=(e.clientX-r.left)/r.width-0.5,py=(e.clientY-r.top)/r.height-0.5;
        c.style.transform=`perspective(1000px) rotateY(${px*6}deg) rotateX(${-py*6}deg) translateZ(10px)`;
      });
    });
  },{passive:true});
})();
</script>
</body>
</html>
