<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SmartBill — Receipt & Expense Manager</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#242c38;--fg:#e6edf3;--mut:#8b98a9;--acc:#4f9cff;--good:#3fb950;--warn:#f0883e;--bad:#f85149}
  @media(prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--line:#e3e8ee;--fg:#1b2430;--mut:#5b6775;--acc:#2563eb}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:18px}.brand span{color:var(--acc)}
  .wrap{max-width:920px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--acc);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;font-weight:600}
  button.ghost{background:transparent;color:var(--fg)}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:4px 0}
  label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:transparent;color:var(--mut);border-color:transparent}
  .tabs button.on{color:var(--fg);border-color:var(--line)}
  .muted{color:var(--mut);font-size:13px}.hide{display:none}
  .bar{height:10px;border-radius:6px;background:var(--acc)}
  .catrow{display:flex;align-items:center;gap:10px;margin:8px 0}
  .catrow .t{width:120px}.catrow .v{width:90px;text-align:right;font-variant-numeric:tabular-nums}
  .catrow .track{flex:1;background:var(--line);border-radius:6px;overflow:hidden}
  .alert{border-left:3px solid var(--warn);background:rgba(240,136,62,.1);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-size:12px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--mut)}
  a{color:var(--acc)}.err{color:var(--bad);font-size:13px}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="brand">Smart<span>Bill</span></div>
  <div id="who"></div>
</header>

<!-- LOGIN -->
<div class="wrap" id="auth">
  <div class="card" style="max-width:420px;margin:40px auto">
    <h2 style="margin-top:0">Sign in</h2>
    <button style="width:100%" onclick="google()">Continue with Google</button>
    <div class="tabs" style="margin-top:16px">
      <button class="on" onclick="authTab('email',event)">Email</button>
      <button onclick="authTab('phone',event)">Phone</button>
    </div>
    <div id="tab-email">
      <label>Email</label><input id="em" type="email" placeholder="you@example.com"/>
      <label>Password</label><input id="pw" type="password" placeholder="••••••••"/>
      <div class="row" style="margin-top:8px">
        <button onclick="emailAuth('in')">Log in</button>
        <button class="ghost" onclick="emailAuth('up')">Sign up</button>
      </div>
    </div>
    <div id="tab-phone" class="hide">
      <label>Phone (with country code)</label><input id="ph" placeholder="+9198…"/>
      <button style="width:100%;margin-top:6px" onclick="sendOtp()">Send code</button>
      <div id="otpbox" class="hide">
        <label>6-digit code</label><input id="otp" inputmode="numeric"/>
        <button style="width:100%" onclick="verifyOtp()">Verify</button>
      </div>
    </div>
    <p class="err" id="authErr"></p>
    <p class="muted" id="cfgWarn"></p>
  </div>
</div>

<!-- APP -->
<div class="wrap hide" id="app">
  <div class="tabs">
    <button class="on" onclick="view('add',event)">Add receipt</button>
    <button onclick="view('dash',event)">Insights</button>
  </div>

  <div id="v-add">
    <div class="card">
      <div class="drop" id="drop">
        <input id="file" type="file" accept="image/*" class="hide"/>
        <p>Drop a receipt image or <a href="#" onclick="file.click();return false">browse</a></p>
        <p class="muted" id="ocrStat"></p>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div><label>Store</label><input id="f_store"/></div>
        <div><label>Date</label><input id="f_date" type="date"/></div>
      </div>
      <div class="row">
        <div><label>Amount (₹)</label><input id="f_amount" type="number" step="0.01"/></div>
        <div><label>Tax (₹)</label><input id="f_tax" type="number" step="0.01"/></div>
        <div><label>Category</label>
          <select id="f_cat"></select>
        </div>
      </div>
      <label>Items (one per line)</label>
      <textarea id="f_items" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:9px;font:inherit"></textarea>
      <button style="margin-top:10px" onclick="saveExpense()">Save expense</button>
      <span class="err" id="saveErr"></span>
    </div>
  </div>

  <div id="v-dash" class="hide">
    <div class="card">
      <div class="row" style="align-items:center;margin-bottom:6px">
        <h3 style="margin:0;flex:1">Insights</h3>
        <input id="monPick" type="month" style="flex:0 0 auto;width:auto;margin:0"/>
        <button class="ghost" style="flex:0 0 auto" onclick="exportCsv()">Export CSV</button>
      </div>
      <div id="alerts"></div>
      <div id="cats"></div>
      <p class="muted" id="dashEmpty"></p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Recent</h3>
      <table><thead><tr><th>Date</th><th>Store</th><th>Cat</th><th style="text-align:right">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const localDate=len=>{const d=new Date();return(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')).slice(0,len);};
const CATS=["Food","Transport","Shopping","Groceries","Bills","Health","Entertainment","Other"];
const KW={Food:["restaurant","cafe","pizza","burger","zomato","swiggy","dine","food","bakery"],
  Transport:["uber","ola","fuel","petrol","diesel","metro","taxi","cab","travel"],
  Groceries:["mart","supermarket","grocery","dmart","bigbasket","kirana"],
  Shopping:["mall","fashion","apparel","store","myntra","amazon","flipkart"],
  Bills:["electric","recharge","broadband","bill","utility","gas"],
  Health:["pharmacy","medical","hospital","clinic","apollo","chemist"],
  Entertainment:["cinema","movie","pvr","netflix","game"]};
CATS.forEach(c=>f_cat.add(new Option(c,c)));

let sb=null;
if(window.SB_URL&&!SB_URL.includes("YOUR")){sb=supabase.createClient(SB_URL,SB_ANON);}
else{cfgWarn.textContent="⚠ Add your keys in config.js to enable login & saving.";}

function authTab(t,e){tab_email.classList.toggle('hide',t!='email');tab_phone.classList.toggle('hide',t!='phone');
  document.querySelectorAll('#auth .tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');}
function view(v,e){['add','dash'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hide',x!=v));
  document.querySelectorAll('#app .tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');
  if(v=='dash')loadDash();}

async function google(){if(!sb)return;await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});}
async function emailAuth(m){if(!sb)return;authErr.textContent="";
  const email=em.value.trim(),password=pw.value;
  const fn=m=='up'?sb.auth.signUp:sb.auth.signInWithPassword;
  const{error}=await fn.call(sb.auth,{email,password});
  if(error)authErr.textContent=error.message;else if(m=='up')authErr.textContent="Check your email to confirm, then log in.";}
async function sendOtp(){if(!sb)return;authErr.textContent="";
  const{error}=await sb.auth.signInWithOtp({phone:ph.value.trim()});
  if(error)authErr.textContent=error.message;else otpbox.classList.remove('hide');}
async function verifyOtp(){if(!sb)return;
  const{error}=await sb.auth.verifyOtp({phone:ph.value.trim(),token:otp.value.trim(),type:'sms'});
  if(error)authErr.textContent=error.message;}

async function refreshUser(){if(!sb)return;const{data}=await sb.auth.getUser();gate(data.user);}
function gate(user){
  document.getElementById('auth').classList.toggle('hide',!!user);
  document.getElementById('app').classList.toggle('hide',!user);
  who.innerHTML = user? `<span class="muted">${user.email||user.phone}</span> <button class="ghost" onclick="signOut()">Sign out</button>`:'';
  if(!f_date.value)f_date.value=localDate(10);
}
async function signOut(){await sb.auth.signOut();location.reload();}
if(sb){sb.auth.onAuthStateChange((_,s)=>gate(s&&s.user));refreshUser();}

// ---- OCR ----
drop.addEventListener('dragover',e=>{e.preventDefault();});
drop.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])ocr(e.dataTransfer.files[0]);});
file.addEventListener('change',e=>{if(e.target.files[0])ocr(e.target.files[0]);});
async function ocr(f){
  ocrStat.textContent="Reading… 0%";
  try{
    const{data}=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.status=='recognizing text')ocrStat.textContent="Reading… "+Math.round(m.progress*100)+"%";}});
    ocrStat.textContent="Extracted. Review below ✎";
    parse(data.text);
  }catch(err){ocrStat.textContent="OCR failed: "+err.message;}
}
function parse(text){
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  f_items.value=lines.slice(0,12).join('\n');
  // store = first meaningful line
  f_store.value=(lines.find(l=>/[a-z]/i.test(l))||'').slice(0,60);
  // amount = biggest number near "total", else biggest number
  const nums=[...text.matchAll(/(\d[\d,]*\.\d{2})/g)].map(m=>+m[1].replace(/,/g,''));
  let total=0;
  const tl=lines.find(l=>/total/i.test(l)&&/\d/.test(l));
  if(tl){const m=tl.match(/(\d[\d,]*\.?\d*)/g);if(m)total=+m[m.length-1].replace(/,/g,'');}
  if(!total&&nums.length)total=Math.max(...nums);
  f_amount.value=total||'';
  // tax
  const xl=lines.find(l=>/(tax|gst|vat)/i.test(l)&&/\d/.test(l));
  if(xl){const m=xl.match(/(\d[\d,]*\.?\d*)/g);if(m)f_tax.value=+m[m.length-1].replace(/,/g,'');}
  // date
  const dm=text.match(/(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/);
  if(dm){const p=dm[1].split(/[\/\-.]/);let[a,b,c]=p;if(c.length==2)c='20'+c;
    if(+a>31){f_date.value=`${a}-${b.padStart(2,'0')}-${c.padStart(2,'0')}`;}
    else{f_date.value=`${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;}}
  // category guess
  const low=text.toLowerCase();let cat="Other";
  for(const c in KW){if(KW[c].some(k=>low.includes(k))){cat=c;break;}}
  f_cat.value=cat;
}

// ---- SAVE ----
async function saveExpense(){
  saveErr.textContent="";if(!sb){saveErr.textContent="Configure Supabase first.";return;}
  const{data:{user}}=await sb.auth.getUser();
  const rec={user_id:user.id,store:f_store.value||'Unknown',purchased_on:f_date.value,
    amount:+f_amount.value||0,tax:+f_tax.value||0,category:f_cat.value,
    items:f_items.value.split('\n').filter(Boolean)};
  const{error}=await sb.from('expenses').insert(rec);
  if(error){saveErr.textContent=error.message;return;}
  ['f_store','f_amount','f_tax','f_items'].forEach(id=>document.getElementById(id).value='');
  ocrStat.textContent="Saved ✓ Add another or view Insights.";
}

// ---- DASHBOARD ----
let _exp=[];
async function loadDash(){
  const{data,error}=await sb.from('expenses').select('*').order('purchased_on',{ascending:false});
  if(error){dashEmpty.textContent=error.message;return;}
  _exp=data;
  if(!monPick.value)monPick.value=localDate(7);
  renderRecent(data);renderInsights(data,monPick.value);
}
monPick.addEventListener('change',()=>renderInsights(_exp,monPick.value));
function exportCsv(){
  const head=['date','store','category','amount','tax','items'];
  const esc=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const body=_exp.map(r=>[r.purchased_on,r.store,r.category,r.amount,r.tax,(r.items||[]).join('; ')].map(esc).join(','));
  const csv=[head.join(','),...body].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='smartbill-expenses.csv';a.click();URL.revokeObjectURL(a.href);
}
function ym(d){return d.slice(0,7);}
function renderRecent(data){
  rows.innerHTML=data.slice(0,15).map(r=>`<tr>
    <td>${r.purchased_on}</td><td>${r.store||''}</td><td><span class="pill">${r.category}</span></td>
    <td style="text-align:right">₹${(+r.amount).toLocaleString('en-IN')}</td>
    <td><a href="#" onclick="del('${r.id}');return false" class="err">✕</a></td></tr>`).join('')
    ||'<tr><td colspan=5 class="muted">No expenses yet.</td></tr>';
}
async function del(id){await sb.from('expenses').delete().eq('id',id);loadDash();}
function renderInsights(data,curM){
  const[Y,M]=curM.split('-').map(Number);
  const cur={},hist={}; // category totals: selected month vs prior 3 months
  const prior=new Set();for(let i=1;i<=3;i++){let mm=M-i,yy=Y;while(mm<1){mm+=12;yy--;}prior.add(yy+'-'+String(mm).padStart(2,'0'));}
  data.forEach(r=>{const m=ym(r.purchased_on),a=+r.amount;
    if(m==curM)cur[r.category]=(cur[r.category]||0)+a;
    if(prior.has(m)){hist[r.category]=hist[r.category]||[];hist[r.category].push(a);} });
  const curTotal=Object.values(cur).reduce((a,b)=>a+b,0);
  dashEmpty.textContent=curTotal?'':'No spending recorded this month.';
  const max=Math.max(1,...Object.values(cur));
  cats.innerHTML=Object.entries(cur).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
    <div class="catrow"><div class="t">${c}</div>
      <div class="track"><div class="bar" style="width:${v/max*100}%"></div></div>
      <div class="v">₹${v.toLocaleString('en-IN')}</div></div>`).join('');
  // unusual spending: current month category vs 3-month monthly average
  const al=[];
  for(const c in cur){
    const h=hist[c];if(!h||!h.length)continue;
    const avg=h.reduce((a,b)=>a+b,0)/3; // avg per month over 3 months
    if(avg>0&&cur[c]>avg*1.2){const pct=Math.round((cur[c]/avg-1)*100);
      al.push(`Your <b>${c}</b> spending is <b>${pct}% higher</b> than your 3-month average (₹${Math.round(avg).toLocaleString('en-IN')}).`);}
  }
  alerts.innerHTML=al.map(a=>`<div class="alert">${a}</div>`).join('');
}
</script>
</body>
</html>
